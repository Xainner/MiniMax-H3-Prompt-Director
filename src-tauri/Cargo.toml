[package]
name = "director"
version = "0.1.0"
description = "Generador de prompts profesionales para MiniMax H3"
authors = ["Director"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "director_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0.20"
sha2 = "0.10.9"
base64 = "0.23.1"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
image = "0.25.9"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
